<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Vortex - Complex Hegemony (With Examples)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="hud">
    <div class="hud-section" id="hud-environment">
        <label>ENVIRONMENT</label>
        <span class="value">Multipolar equilibrium with minor friction</span>
    </div>
    <div class="hud-section" id="hud-entities">
        <label>ENTITIES</label>
        <span class="value">Interacting across scales</span>
    </div>
    <div class="hud-section" id="hud-systems">
        <label>SYSTEMS</label>
        <span class="value">Metastable Attractor</span>
    </div>
    <div class="hud-section" id="hud-examples">
        <label>EXAMPLES</label>
        <span class="value">Stable, US-led order (Bretton Woods) holds</span>
    </div>
</div>

<div id="canvas-container">
    <canvas id="vortexCanvas"></canvas>
</div>

<div id="ui-panel">
    <h3>SYSTEMIC FORCES</h3>
    <div class="subtitle">Relational Power & Complex Hegemony</div>
    
    <div class="control-group">
        <label>
            <span>Downward Causation (Lock-in Force)</span>
            <span class="value-display" id="v-pull">Moderate</span>
        </label>
        <input type="range" id="pullForce" min="1" max="5" step="1" value="3">
    </div>
    
    <div class="control-group">
        <label>
            <span>Relational Power (Flow Speed)[Direct Text Answer] -> [Explanation of Method] -> [JSON Widget].
