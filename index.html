<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside id="sidebar">
        <h2>COMPLEX HEGEMONY</h2>
        <div id="hud">
            <div class="hud-line">ENVIRONMENT: <span class="highlight-blue">GAME SPACE</span></div>
            <div class="hud-line">SYSTEM: <span id="hud-status">METASTABLE</span></div>
            <div class="hud-line border-top">SPATIAL FIX: <span id="hud-spatial-fix">...</span></div>
        </div>
        <div id="controls">
            <label>Downward Causation <input type="range" id="pullForce" min="1" max="5" value="3"></label>
            <label>Relational Power <input type="range" id="speedForce" min="1" max="5" value="2"></label>
        </div>
        <div id="glossary">
            <h3>GLOSSARY</h3>
            <ul>
                <li><strong>Game Space:</strong> Structural environment reconfigured by hegemon.</li>
                <li><strong>Spatial Fix:</strong> Geographical anchoring of excess capital.</li>
                <li><strong>Consent:</strong> Gramscian legitimation of hegemony.</li>
            </ul>
        </div>
    </aside>
    <main id="canvas-container">
        <canvas id="vortexCanvas"></canvas>
    </main>
    <script src="script.js"></script>
</body>
</html>
